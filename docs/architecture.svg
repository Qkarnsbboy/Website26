<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 650" width="860" height="650" role="img" aria-label="Website26 architecture: src and public are turned into static files in dist by astro build; the page is composed of BaseLayout wrapping index.astro, which renders Navbar, seven sections inside main, and Footer.">
  <title>Website26 Architecture</title>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d7085"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c8940a"/>
    </marker>
    <style>
      .h  { font: 700 11px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1.4px; fill: #5d7085; }
      .n  { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #10202f; }
      .m  { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5d7085; }
      .c  { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #10202f; }
      .s  { font: 400 9.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5d7085; }
      .g  { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a37907; }
      .box  { fill: #f4f6f9; stroke: #c9d3df; stroke-width: 1; }
      .box2 { fill: #ffffff; stroke: #c9d3df; stroke-width: 1; }
      .boxg { fill: #fffaea; stroke: #c8940a; stroke-width: 1.3; }
      .dash { fill: none; stroke: #c9d3df; stroke-width: 1; stroke-dasharray: 4 4; }
      .dashg{ fill: none; stroke: #c8940a; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .e  { stroke: #5d7085; stroke-width: 1.3; fill: none; }
      .eg { stroke: #c8940a; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="860" height="650" fill="#ffffff"/>

  <!-- ============ BUILD ============ -->
  <text class="h" x="32" y="34">BUILD</text>

  <rect class="box" x="32" y="48" width="180" height="92" rx="4"/>
  <text class="n" x="48" y="72">src/</text>
  <text class="m" x="48" y="94">pages/index.astro</text>
  <text class="m" x="48" y="112">layouts/ · components/</text>
  <text class="m" x="48" y="130">TypeScript + Tailwind</text>

  <rect class="box" x="32" y="156" width="180" height="44" rx="4"/>
  <text class="n" x="48" y="184">public/</text>

  <rect class="boxg" x="300" y="72" width="150" height="68" rx="4"/>
  <text class="n" x="375" y="102" text-anchor="middle">astro build</text>
  <text class="m" x="375" y="122" text-anchor="middle">runs once</text>

  <rect class="box" x="540" y="48" width="248" height="92" rx="4"/>
  <text class="n" x="556" y="72">dist/</text>
  <text class="m" x="556" y="94">index.html</text>
  <text class="m" x="556" y="112">_astro/[hash].css</text>
  <text class="m" x="556" y="130">static — no JS bundle</text>

  <rect class="box" x="540" y="156" width="248" height="44" rx="4"/>
  <text class="c" x="556" y="184">assets/ · resume.pdf</text>

  <line class="e" x1="212" y1="94" x2="294" y2="102" marker-end="url(#arw)"/>
  <line class="e" x1="450" y1="106" x2="534" y2="96" marker-end="url(#arw)"/>
  <line class="eg" x1="212" y1="178" x2="534" y2="178" marker-end="url(#arwg)"/>
  <text class="g" x="373" y="170" text-anchor="middle">copied as-is, skips the build</text>

  <line x1="32" y1="234" x2="828" y2="234" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============ PAGE STRUCTURE ============ -->
  <text class="h" x="32" y="268">PAGE STRUCTURE</text>

  <rect class="dashg" x="32" y="286" width="796" height="300" rx="6"/>
  <text class="n" x="48" y="310">BaseLayout.astro</text>
  <text class="m" x="180" y="310">&lt;html&gt; · &lt;head&gt; · &lt;body&gt; · &lt;slot/&gt;</text>

  <rect class="box" x="52" y="328" width="756" height="240" rx="5"/>
  <text class="n" x="68" y="352">index.astro</text>
  <text class="m" x="180" y="352">imports and composes — no markup of its own</text>

  <rect class="box2" x="72" y="364" width="716" height="30" rx="3"/>
  <text class="c" x="86" y="384">Navbar.astro</text>
  <text class="s" x="774" y="384" text-anchor="end">fixed · links to #ids below</text>

  <rect class="dash" x="72" y="404" width="716" height="124" rx="4"/>
  <text class="s" x="84" y="420">&lt;main&gt;</text>

  <rect class="box2" x="84" y="428" width="92" height="52" rx="3"/>
  <text class="c" x="130" y="459" text-anchor="middle">Hero</text>

  <rect class="box2" x="184" y="428" width="92" height="52" rx="3"/>
  <text class="c" x="230" y="459" text-anchor="middle">About</text>

  <rect class="box2" x="284" y="428" width="92" height="52" rx="3"/>
  <rect x="284" y="428" width="92" height="4" rx="2" fill="#ffcc00"/>
  <text class="c" x="330" y="455" text-anchor="middle">Experience</text>
  <text class="s" x="330" y="470" text-anchor="middle">experiences[]</text>

  <rect class="box2" x="384" y="428" width="92" height="52" rx="3"/>
  <rect x="384" y="428" width="92" height="4" rx="2" fill="#ffcc00"/>
  <text class="c" x="430" y="455" text-anchor="middle">Projects</text>
  <text class="s" x="430" y="470" text-anchor="middle">projects[]</text>

  <rect class="box2" x="484" y="428" width="92" height="52" rx="3"/>
  <rect x="484" y="428" width="92" height="4" rx="2" fill="#ffcc00"/>
  <text class="c" x="530" y="455" text-anchor="middle">Poker</text>
  <text class="s" x="530" y="470" text-anchor="middle" font-size="8.5">stats[] skills[]</text>

  <rect class="box2" x="584" y="428" width="92" height="52" rx="3"/>
  <rect x="584" y="428" width="92" height="4" rx="2" fill="#ffcc00"/>
  <text class="c" x="630" y="455" text-anchor="middle">Skills</text>
  <text class="s" x="630" y="470" text-anchor="middle">skillGroups[]</text>

  <rect class="box2" x="684" y="428" width="92" height="52" rx="3"/>
  <text class="c" x="730" y="459" text-anchor="middle">Contact</text>

  <line class="e" x1="84" y1="506" x2="774" y2="506" marker-end="url(#arw)"/>
  <text class="s" x="429" y="500" text-anchor="middle">order in the file = order down the page</text>

  <rect class="box2" x="72" y="538" width="716" height="30" rx="3"/>
  <text class="c" x="86" y="558">Footer.astro</text>
  <text class="s" x="774" y="558" text-anchor="end">year computed at build time</text>

  <!-- legend -->
  <rect x="32" y="612" width="12" height="12" rx="2" fill="#ffcc00"/>
  <text class="m" x="52" y="622">gold bar = content defined as a data array in the file's --- fence; edit the array to change the page</text>
</svg>
